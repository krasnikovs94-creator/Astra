<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Астра — голосовой помощник</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 12%,#293d79 0%,#141b39 42%,#090e1d 100%);color:#f6f7ff;min-height:100dvh}.app{max-width:680px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:20px 4px 12px}h1{font-size:25px;margin:0;letter-spacing:.4px}small{color:#b9c5eb}.status{font-size:12px;color:#aab8e4}.hero{text-align:center;padding:12px 0 8px}.orb{margin:10px auto 16px;width:122px;height:122px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#d6f9ff,#88a9ff 30%,#7467de 60%,#2b2d76 100%);box-shadow:0 0 45px #7587ff77,0 0 100px #5b65dd44;display:grid;place-items:center;font-size:45px;transition:transform .2s}.orb.listening{animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.09);box-shadow:0 0 75px #9bcfff}}.hero p{margin:0;color:#d0d8f8;font-size:14px}.chat{flex:1;overflow-y:auto;min-height:170px;padding:10px 2px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:90%;border-radius:18px;padding:12px 15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.assistant{align-self:flex-start;background:#26345b}.user{align-self:flex-end;background:#4d5eb6}.composer{display:flex;gap:8px;padding:12px 0 18px;align-items:center}input{flex:1;min-width:0;border:1px solid #586690;border-radius:18px;padding:14px 13px;background:#182344;color:white;font-size:16px;outline:none}button{border:0;color:white;cursor:pointer;background:#5268c7;border-radius:16px;min-width:48px;height:48px;font-size:22px}button:disabled{opacity:.4}.hint{text-align:center;color:#9aabd4;font-size:12px;padding-bottom:8px}#config{background:transparent;font-size:22px}dialog{background:#1c2849;color:white;border:1px solid #6473a2;border-radius:20px;padding:22px;width:min(92vw,440px)}dialog input{width:100%;margin:12px 0}dialog button{font-size:15px;padding:0 18px}dialog::backdrop{background:#0009}label{font-size:14px}a{color:#b4cbff}
</style></head><body><main class="app"><header><div><h1>Астра ✦</h1><small>Твой голосовой помощник</small></div><button id="config" aria-label="Настройки">⚙</button></header><section class="hero"><div class="orb" id="orb">✦</div><p id="status">Напиши сообщение или нажми микрофон</p></section><section class="chat" id="chat" aria-live="polite"></section><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="Спроси Астру…" aria-label="Сообщение"><button type="button" id="mic" aria-label="Голосовой ввод">🎙</button><button type="submit" id="send" aria-label="Отправить">➤</button></form><div class="hint">GPT подключается через защищённый сервер · Голос зависит от браузера</div></main><dialog id="settings"><h2>Настройки Астры</h2><label for="endpoint">Адрес вашего HTTPS API-сервера</label><input id="endpoint" placeholder="https://example.com/api/chat" inputmode="url"><p style="font-size:13px;color:#bdc8e9">Сервер должен принимать POST JSON с полем messages и возвращать JSON с полем reply. Не вводите сюда API-ключ OpenAI.</p><label><input type="checkbox" id="speak" checked style="width:auto;margin-right:8px">Озвучивать ответы</label><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button id="close" type="button">Закрыть</button><button id="save" type="button">Сохранить</button></div></dialog><script src="app.js" defer></script></body></html>
